[package]
name = "debdrop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Inspect and install local .deb packages"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_7"] }
async-channel = "2"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
